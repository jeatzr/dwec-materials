<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 584" width="760" height="584" role="img" aria-label="One page, three phases: the page swaps organisms, atoms are reused" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root {
      --ink: #1f2937;
      --quiet: #6b7280;
      --edge: #b8b5a8;
      --grid: #d1d5db;
      --organism: #2b6fd6;
      --molecule: #e8622c;
      --atom: #1fa97a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f3f4f6;
        --quiet: #a1a1aa;
        --edge: #6b7280;
        --grid: #4b5563;
        --organism: #5b9bff;
        --molecule: #ff8a57;
        --atom: #3fcf9f;
      }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: var(--ink); }
    .title { font-size: 15px; font-weight: 600; }
    .strong { font-weight: 600; }
    .small { font-size: 11.5px; }
    .quiet { fill: var(--quiet); }
    .center { text-anchor: middle; }
    .end { text-anchor: end; }
    .page { fill: none; stroke: var(--edge); stroke-width: 1.25; }
    .organism { fill: none; stroke: var(--organism); stroke-width: 2; }
    .molecule { fill: none; stroke: var(--molecule); stroke-width: 1.25; }
    .atom { fill: var(--atom); fill-opacity: 0.12; stroke: var(--atom); stroke-width: 1.25; }
    .radio { fill: none; stroke: var(--edge); stroke-width: 1.25; }
    .track { fill: var(--grid); }
    .fill { fill: var(--atom); }
    .lead { fill: none; stroke-width: 1.25; }
    .lead-page { stroke: var(--edge); }
    .lead-organism { stroke: var(--organism); }
    .lead-molecule { stroke: var(--molecule); }
    .lead-atom { stroke: var(--atom); }
    .dot-page { fill: var(--edge); }
    .dot-organism { fill: var(--organism); }
    .dot-molecule { fill: var(--molecule); }
    .dot-atom { fill: var(--atom); }
  </style>

  <text class="title" x="24" y="34">One page, three phases: the page swaps organisms, atoms are reused</text>

  <!-- QuizPage, phase: playing -->
  <rect class="page" x="24" y="56" width="392" height="368" rx="12"/>
  <text class="strong" x="40" y="84">Web Dev Quiz</text>

  <!-- ProgressBar (atom) -->
  <rect class="atom" x="40" y="96" width="360" height="44" rx="8"/>
  <rect class="track" x="56" y="108" width="328" height="8" rx="4"/>
  <rect class="fill" x="56" y="108" width="131" height="8" rx="4"/>
  <text class="small quiet" x="56" y="134">Question 2 of 5</text>

  <!-- QuestionCard (organism) -->
  <rect class="organism" x="40" y="152" width="360" height="214" rx="10"/>

  <!-- QuestionHeader (molecule) -->
  <rect class="molecule" x="56" y="164" width="328" height="68" rx="8"/>
  <text x="68" y="218">Which keyword declares a constant?</text>

  <!-- Badges (atoms) -->
  <rect class="atom" x="68" y="174" width="84" height="20" rx="10"/>
  <text class="small center" x="110" y="188">JavaScript</text>
  <rect class="atom" x="164" y="174" width="44" height="20" rx="10"/>
  <text class="small center" x="186" y="188">easy</text>

  <!-- AnswerOption x4 (molecules) -->
  <rect class="molecule" x="56" y="244" width="328" height="24" rx="8"/>
  <circle class="radio" cx="74" cy="256" r="6"/>
  <text x="90" y="261">var</text>

  <rect class="molecule" x="56" y="272" width="328" height="24" rx="8"/>
  <circle class="radio" cx="74" cy="284" r="6"/>
  <text x="90" y="289">const</text>

  <rect class="molecule" x="56" y="300" width="328" height="24" rx="8"/>
  <circle class="radio" cx="74" cy="312" r="6"/>
  <text x="90" y="317">let</text>

  <rect class="molecule" x="56" y="328" width="328" height="24" rx="8"/>
  <circle class="radio" cx="74" cy="340" r="6"/>
  <text x="90" y="345">def</text>

  <!-- Button (atom) -->
  <rect class="atom" x="156" y="380" width="128" height="28" rx="8"/>
  <text class="small center" x="220" y="398">Next question</text>

  <!-- Callouts -->
  <circle class="dot-page" cx="416" cy="70" r="3"/>
  <path class="lead lead-page" d="M416 70H424L440 72H448"/>
  <text class="strong" x="456" y="76">QuizPage</text>
  <text class="small quiet" x="456" y="92">page · owns the state and the phase</text>

  <circle class="dot-atom" cx="400" cy="118" r="3"/>
  <path class="lead lead-atom" d="M400 118H424L440 108H448"/>
  <text class="strong" x="456" y="112">ProgressBar</text>
  <text class="small quiet" x="456" y="128">atom · progress through the quiz</text>

  <circle class="dot-organism" cx="400" cy="160" r="3"/>
  <path class="lead lead-organism" d="M400 160H424L440 144H448"/>
  <text class="strong" x="456" y="148">QuestionCard</text>
  <text class="small quiet" x="456" y="164">organism · header + four answers</text>

  <circle class="dot-atom" cx="208" cy="184" r="3"/>
  <path class="lead lead-atom" d="M208 184H424L440 180H448"/>
  <text class="strong" x="456" y="184">Badge</text>
  <text class="small quiet" x="456" y="200">atom · category and difficulty</text>

  <circle class="dot-molecule" cx="384" cy="212" r="3"/>
  <path class="lead lead-molecule" d="M384 212H424L440 216H448"/>
  <text class="strong" x="456" y="220">QuestionHeader</text>
  <text class="small quiet" x="456" y="236">molecule · badges + question text</text>

  <circle class="dot-molecule" cx="384" cy="256" r="3"/>
  <path class="lead lead-molecule" d="M384 256H424L440 252H448"/>
  <text class="strong" x="456" y="256">AnswerOption</text>
  <text class="small quiet" x="456" y="272">molecule · radio input + answer text</text>

  <circle class="dot-atom" cx="284" cy="394" r="3"/>
  <path class="lead lead-atom" d="M284 394H424L440 394H448"/>
  <text class="strong" x="456" y="398">Button</text>
  <text class="small quiet" x="456" y="414">atom · reused in all three phases</text>

  <!-- The other two phases -->
  <text class="strong" x="24" y="452">The same page in its other two phases</text>

  <!-- StartScreen (organism) -->
  <rect class="organism" x="24" y="464" width="188" height="96" rx="10"/>
  <text class="strong" x="40" y="488">StartScreen</text>
  <text class="small quiet end" x="196" y="488">organism</text>
  <rect class="atom" x="40" y="508" width="92" height="26" rx="8"/>
  <text class="small center" x="86" y="525">Start quiz</text>

  <!-- ScorePanel (organism) -->
  <rect class="organism" x="228" y="464" width="188" height="96" rx="10"/>
  <text class="strong" x="244" y="488">ScorePanel</text>
  <text class="small quiet end" x="400" y="488">organism</text>
  <text x="244" y="512">Your score: n / 5</text>
  <rect class="atom" x="244" y="522" width="92" height="26" rx="8"/>
  <text class="small center" x="290" y="539">Play again</text>
</svg>
