</text><rect x="412" y="400" width="488" height="100" rx="8" fill="#fff" stroke="#d4d4d8"/><text x="428" y="430" class="h3" style="font-size:15px">ea molestias quasi exercitationem</text><text x="428" y="454" class="s">et iusto sed quo iure voluptatem occaecati omnis</text><text x="428" y="474" class="s">eligendi aut ad voluptatem doloribus vel accusantium</text><rect x="8" y="56" width="944" height="496" rx="6" fill="none" stroke="#db2777" stroke-width="2" stroke-dasharray="6 4"/><rect x="36" y="78" width="888" height="462" rx="6" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/><rect x="48" y="136" width="352" height="388" rx="6" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/><rect x="404" y="176" width="504" height="332" rx="6" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/><rect x="56" y="144" width="328" height="124" rx="6" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/><rect x="408" y="180" width="496" height="108" rx="6" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/><rect x="76" y="226" width="100" height="28" rx="6" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/><circle cx="8" cy="56" r="10" fill="#db2777" stroke="#fff" stroke-width="1.5"/><text x="8" y="60" class="n">1</text><circle cx="36" cy="78" r="10" fill="#7c3aed" stroke="#fff" stroke-width="1.5"/><text x="36" y="82" class="n">2</text><circle cx="48" cy="136" r="10" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="48" y="140" class="n">3</text><circle cx="384" cy="144" r="10" fill="#d97706" stroke="#fff" stroke-width="1.5"/><text x="384" y="148" class="n">4</text><circle cx="176" cy="254" r="10" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><text x="176" y="258" class="n">5</text><circle cx="404" cy="176" r="10" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="404" y="180" class="n">6</text><circle cx="904" cy="180" r="10" fill="#d97706" stroke="#fff" stroke-width="1.5"/><text x="904" y="184" class="n">7</text><text x="24" y="592" class="h2">Component breakdown</text><text x="936" y="592" text-anchor="end" class="s">Colors show the Atomic Design level</text><circle cx="34" cy="626" r="10" fill="#db2777" stroke="#fff" stroke-width="1.5"/><text x="34" y="630" class="n">1</text><text x="54" y="631" class="lg"><tspan style="font-weight:700">UsersPage</tspan><tspan dx="8" style="fill:#db2777;font-weight:600;font-size:12px">page</tspan></text><text x="54" y="648" class="s" style="font-size:12px">Fetches the users and owns selectedUser</text><circle cx="34" cy="672" r="10" fill="#7c3aed" stroke="#fff" stroke-width="1.5"/><text x="34" y="676" class="n">2</text><text x="54" y="677" class="lg"><tspan style="font-weight:700">TwoColumnTemplate</tspan><tspan dx="8" style="fill:#7c3aed;font-weight:600;font-size:12px">template</tspan></text><text x="54" y="694" class="s" style="font-size:12px">Layout: title, left and right slots</text><circle cx="34" cy="718" r="10" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="34" y="722" class="n">3</text><text x="54" y="723" class="lg"><tspan style="font-weight:700">UserList</tspan><tspan dx="8" style="fill:#2563eb;font-weight:600;font-size:12px">organism</tspan></text><text x="54" y="740" class="s" style="font-size:12px">Maps users to UserCard</text><circle cx="34" cy="764" r="10" fill="#d97706" stroke="#fff" stroke-width="1.5"/><text x="34" y="768" class="n">4</text><text x="54" y="769" class="lg"><tspan style="font-weight:700">UserCard</tspan><tspan dx="8" style="fill:#d97706;font-weight:600;font-size:12px">molecule</tspan></text><text x="54" y="786" class="s" style="font-size:12px">Name, email, company + Button</text><circle cx="510" cy="626" r="10" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><text x="510" y="630" class="n">5</text><text x="530" y="631" class="lg"><tspan style="font-weight:700">Button</tspan><tspan dx="8" style="fill:#16a34a;font-weight:600;font-size:12px">atom</tspan></text><text x="530" y="648" class="s" style="font-size:12px">Reused from Part 1</text><circle cx="510" cy="672" r="10" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="510" y="676" class="n">6</text><text x="530" y="677" class="lg"><tspan style="font-weight:700">PostList</tspan><tspan dx="8" style="fill:#2563eb;font-weight:600;font-size:12px">organism</tspan></text><text x="530" y="694" class="s" style="font-size:12px">Fetches posts when userId changes (useEffect)</text><circle cx="510" cy="718" r="10" fill="#d97706" stroke="#fff" stroke-width="1.5"/><text x="510" y="722" class="n">7</text><text x="530" y="723" class="lg"><tspan style="font-weight:700">PostItem</tspan><tspan dx="8" style="fill:#d97706;font-weight:600;font-size:12px">molecule</tspan></text><text x="530" y="740" class="s" style="font-size:12px">Title and body of one post</text><text x="504" y="764" class="s" style="font-size:12px;font-style:italic">Not visible here: Spinner and ErrorMessage (atoms),</text><text x="504" y="782" class="s" style="font-size:12px;font-style:italic">shown instead of the lists while loading or on error.</text></svg>