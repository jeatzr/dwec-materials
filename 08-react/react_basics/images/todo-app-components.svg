><tspan style="font-weight:700">TodoList</tspan><tspan dx="8" style="fill:#2563eb;font-weight:600;font-size:12px">organism</tspan></text><text x="402" y="518" class="s" style="font-size:12px">Maps todos to TodoItem (key = id)</text><circle cx="382" cy="542" r="10" fill="#d97706" stroke="#fff" stroke-width="1.5"/><text x="382" y="546" class="n">7</text><text x="402" y="547" class="lg"><tspan style="font-weight:700">TodoItem</tspan><tspan dx="8" style="fill:#d97706;font-weight:600;font-size:12px">molecule</tspan></text><text x="402" y="564" class="s" style="font-size:12px">Checkbox + text + Button</text><circle cx="382" cy="588" r="10" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><text x="382" y="592" class="n">8</text><text x="402" y="593" class="lg"><tspan style="font-weight:700">Checkbox</tspan><tspan dx="8" style="fill:#16a34a;font-weight:600;font-size:12px">atom</tspan></text><text x="402" y="610" class="s" style="font-size:12px">Reports the toggle to its parent</text><circle cx="382" cy="634" r="10" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><text x="382" y="638" class="n">9</text><text x="402" y="639" class="lg"><tspan style="font-weight:700">Button</tspan><tspan dx="8" style="fill:#16a34a;font-weight:600;font-size:12px">atom</tspan></text><text x="402" y="656" class="s" style="font-size:12px">Same component, variant="danger"</text><text x="376" y="680" class="s" style="font-size:12px;font-style:italic">Button is used twice: same atom, different props.</text></svg>